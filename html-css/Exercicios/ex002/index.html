<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    
    <p>Voce pode escrever
        um parágrafo de qualquer
        jeito, basta colocando tudo
        no meio de tags &lt;p&gt; e /p&gt;
    </p>
    <p> Se precisar quebrar 
        o texto em algum lugar 
        especifico <br> como esse,
        voce pode usar a tag  &lt;br&gt;      
    </p>
    <p>Vamos adicionar alguns simbolos especiais:
    &reg;
    &rAarr;
    &dollar;
    &real;
    &pound;
    &delta;
    &Delta;
    &yen;
    &uparrow;
    &downarrow;
    &righ
    </p>
    <p>
       😉
    </p>
